<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CodeText Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="home" class="screen on">
  <h1>CodeText Pro</h1>
  <p class="sub">Text, Code &amp; PDF Editor</p>
  <div class="row2">
    <button class="pbtn" data-act="new">➕ नई फाइल</button>
    <button class="pbtn alt" data-act="open">📂 फाइल खोलें</button>
  </div>
  <div class="grid">
    <div class="card" data-go="text"><div class="ic">📝</div><b>Text Editor</b><small>तैयार ✓</small></div>
    <div class="card" data-go="code"><div class="ic">💻</div><b>Code Editor</b><small>जल्द आ रहा है</small></div>
    <div class="card" data-go="pdf"><div class="ic">📄</div><b>PDF Tools</b><small>जल्द आ रहा है</small></div>
    <div class="card" data-act="soon"><div class="ic">📁</div><b>File Manager</b><small>जल्द आ रहा है</small></div>
  </div>
</main>

<section id="text" class="screen">
  <div class="tb">
    <button data-act="new">➕</button>
    <button data-act="open">📂</button>
    <button data-act="save">💾</button>
    <button data-act="saveas">Save As</button>
    <button data-act="undo">↶</button>
    <button data-act="redo">↷</button>
    <button data-act="find">🔍</button>
    <button data-act="all">सब चुनें</button>
    <button data-act="copy">कॉपी</button>
    <button data-act="cut">कट</button>
    <button data-act="paste">पेस्ट</button>
    <button data-act="fminus">A−</button>
    <button data-act="fplus">A+</button>
    <button data-act="align">⇔</button>
    <select id="ff">
      <option value="monospace">Mono</option>
      <option value="system-ui, sans-serif">Sans</option>
      <option value="Georgia, serif">Serif</option>
    </select>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="findbar" hidden>
    <div class="fr"><input id="fq" placeholder="खोजें"><button data-act="fprev">▲</button><button data-act="fnext">▼</button></div>
    <div class="fr"><input id="rq" placeholder="बदलें"><button data-act="rep">बदलें</button><button data-act="repall">सब</button></div>
    <div class="fr2"><label><input type="checkbox" id="cs"> Aa केस मिलाएँ</label><span id="fcount"></span></div>
  </div>
  <textarea id="ed" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
  <div id="stats"></div>
</section>

<section id="code" class="screen">
  <div class="tb">
    <button data-c="new">➕</button>
    <button data-c="open">📂</button>
    <button data-c="save">💾</button>
    <button data-c="saveas">Save As</button>
    <button data-c="undo">↶</button>
    <button data-c="redo">↷</button>
    <button data-c="find">🔍</button>
    <button data-c="fminus">A−</button>
    <button data-c="fplus">A+</button>
    <button data-c="preview">▶ Preview</button>
    <select id="clang"></select>
  </div>
  <div class="tabs" id="ctabs"></div>
  <div id="cm"></div>
  <div id="cstats"></div>
</section>

<section id="preview" class="screen">
  <div class="tb">
    <button data-go="code">← वापस</button>
    <span class="ptitle">HTML Preview · सुरक्षित मोड</span>
  </div>
  <iframe id="pv" sandbox=""></iframe>
</section>

<button id="gopv" data-go="preview" hidden></button>
<button id="gocode" data-go="code" hidden></button>

<section id="pdf" class="screen">
  <h2>📄 PDF Tools</h2>
  <p class="sub">भाग 4 में आएगा (A4/A5/Letter, header/footer, page number)।</p>
</section>

<section id="settings" class="screen">
  <h2>⚙️ Settings</h2>
  <p class="sub">थीम चुनें</p>
  <div class="row2">
    <button class="pbtn alt" data-act="dark">🌙 Dark</button>
    <button class="pbtn alt" data-act="light">☀️ Light</button>
  </div>
  <p class="sub" id="ver"></p>
</section>

<nav>
  <button data-go="home" class="on">🏠<span>Home</span></button>
  <button data-go="text">📝<span>Text</span></button>
  <button data-go="code">💻<span>Code</span></button>
  <button data-go="pdf">📄<span>PDF</span></button>
  <button data-go="settings">⚙️<span>Settings</span></button>
</nav>

<div id="modal" hidden><div class="box"><p id="mmsg"></p><div id="mbtns"></div></div></div>
<div id="toast" hidden></div>

<script src="app.js"></script>
</body>
    </html>
